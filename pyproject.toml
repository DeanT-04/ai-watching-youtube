[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytextract"
version = "0.1.0"
description = "Local, CPU-only YouTube tutorial code extractor: transcript + on-screen code"
requires-python = ">=3.10"
dependencies = [
    "paddleocr==2.7.3",
    "paddlepaddle==2.6.2",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "opencv-python==4.6.0.66",
    "yt-dlp==2026.7.4",
    "faster-whisper==1.2.1",
    "psutil==7.2.2",
    "python-dotenv==1.2.2",
]

[project.scripts]
ytextract = "ytextract.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
